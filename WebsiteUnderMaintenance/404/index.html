<!DOCTYPE html>
<html lang="id">
  <head>
    <style></style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/webp"
      href="https://s6.imgcdn.dev/Y00viN.webp"
    />
    <title>noname</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-900">
    <div
      id="loader"
      class="fixed inset-0 z-[9999] flex flex-col items-center justify-center bg-black transition-opacity duration-500"
    >
      <div
        class="w-12 h-12 border-4 border-gray-600 border-t-blue-500 rounded-full animate-spin"
      ></div>
      <p class="mt-4 text-white font-medium tracking-widest text-sm uppercase">
        Loading
      </p>
    </div>
    <main class="flex min-h-screen items-center justify-center">
      <div class="flex flex-col items-center text-center space-y-4">
        <video
          autoplay
          muted
          loop
          playsinline
          aria-hidden="true"
          controlsList="nodownload"
          oncontextmenu="return false;"
          class="w-80 sm:w-[75%] lg:w-[50%] rounded-xl pointer-events-none"
        >
          <source src="/404/404animation.webm" type="video/webm" />
        </video>

        <h1 class="text-white text-3xl font-extrabold">
          HALAMAN TIDAK DITEMUKAN
        </h1>
        <div class="px-5">
          <p class="text-gray-400 text-sm max-w-2xl mx-auto">
            Maaf, halaman yang Anda cari tidak dapat ditemukan. Silakan periksa
            kembali alamat URL atau kembali ke halaman utama.
          </p>
        </div>
        <a href="">
          <div
            class="bg-blue-700 rounded-xl text-white text-md font-bold px-4 py-2"
          >
            MAIN PAGE
          </div>
        </a>
      </div>
    </main>
    <script>
      const loader = document.getElementById("loader");

      window.addEventListener("load", () => {
        loader.classList.add("opacity-0");

        setTimeout(() => {
          loader.style.display = "none";
        }, 500);
      });
    </script>
  </body>
</html>
